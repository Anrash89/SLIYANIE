<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLIYANIE | Luxury Femme Couture</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --accent: #000000;
            --alert-color: #9e0b0b; 
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Raleway', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* --- СИСТЕМА ЭКРАНОВ (SPA) --- */
        .view-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .view-section.active {
            display: block;
            opacity: 1;
        }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .loader-logo { 
            font-family: var(--font-serif); 
            font-size: 24px; 
            letter-spacing: 2px; 
            margin-bottom: 20px; 
            text-transform: uppercase;
            animation: pulse 2s infinite; 
        }
        .spinner { 
            width: 30px; height: 30px; 
            border: 2px solid #f3f3f3; 
            border-top: 2px solid #000; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* --- HERO SECTION --- */
        .magazine-cover {
            position: relative;
            width: 100%;
            height: 50vh; /* Чуть уменьшил для удобства */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .cover-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: grayscale(100%);
            opacity: 0.9;
        }
        
        .cover-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.1);
        }

        .brand-logo-large {
            width: 140px;
            margin-bottom: 10px;
            z-index: 2;
            animation: fadeDown 1.2s ease-out;
        }
        
        .brand-logo-large img { width: 100%; display: block; }

        .issue-date {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 16px;
            letter-spacing: 1px;
            z-index: 2;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            animation: fadeUp 1.2s ease-out;
        }

        /* --- HEADER & CART ICON --- */
        .nav-header {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(8px);
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            overflow-x: auto;
            flex-grow: 1;
        }

        .nav-item {
            font-family: var(--font-serif);
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            white-space: nowrap;
            padding: 0 5px;
        }

        .nav-item.active {
            color: var(--text-main);
            font-style: italic;
            font-weight: 600;
        }
        
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -4px; left: 0;
            width: 100%; height: 1px; background: #000;
        }

        .cart-icon-wrap {
            position: relative;
            padding: 10px;
            cursor: pointer;
        }
        .cart-count {
            position: absolute;
            top: 5px; right: 0;
            background: #000;
            color: #fff;
            font-size: 10px;
            width: 16px; height: 16px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cart-count.visible { opacity: 1; }

        /* --- PRODUCT GRID --- */
        .editorial-grid {
            display: grid;
            grid-template-columns: 1fr; /* По умолчанию 1 колонка */
            gap: 40px;
            padding: 30px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        /* Можно сделать 2 колонки на экранах пошире */
        @media (min-width: 400px) {
            .editorial-grid {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        .product-article {
            display: flex;
            flex-direction: column;
            cursor: pointer; /* Весь товар кликабелен */
        }

        .photo-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
            margin-bottom: 12px;
            background-color: #f4f4f4;
        }

        .product-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 1.5s ease;
        }

        .badge {
            position: absolute; top: 8px; left: 8px;
            background: #fff; color: #000;
            padding: 4px 8px; font-size: 9px;
            text-transform: uppercase; letter-spacing: 1px;
            z-index: 6; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .badge.alert { background-color: var(--alert-color); color: #fff; }
        .badge.sold-out { background-color: #222; color: #fff; text-decoration: line-through; }

        .product-info { text-align: left; }
        .product-title { font-family: var(--font-serif); font-size: 18px; line-height: 1.1; margin-bottom: 4px; }
        .product-price { font-family: var(--font-serif); font-size: 16px; font-style: italic; color: #333; }

        /* --- PRODUCT DETAILS (Страница товара) --- */
        #view-product {
            background: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        /* Слайдер фото */
        .detail-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            height: 60vh;
            background: #f4f4f4;
        }
        .detail-slide {
            flex: 0 0 100%;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
        }
        .detail-slide img {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        /* Пагинация слайдера */
        .slider-dots {
            display: flex; justify-content: center; gap: 8px;
            margin-top: -30px; position: relative; z-index: 10; padding-bottom: 20px;
        }
        .dot {
            width: 6px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 50%;
            transition: 0.3s;
        }
        .dot.active { background: #fff; transform: scale(1.2); }

        .detail-content { padding: 25px 20px; }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .detail-title { font-family: var(--font-serif); font-size: 28px; line-height: 1; }
        .detail-price { font-family: var(--font-serif); font-size: 22px; font-style: italic; }
        
        .detail-desc { font-size: 14px; line-height: 1.6; color: #444; margin-bottom: 20px; white-space: pre-wrap; }
        .detail-meta { font-size: 12px; color: #888; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        
        .size-selector-wrap { margin-bottom: 30px; }
        .size-label { font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .sizes-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .size-option {
            border: 1px solid #ddd; padding: 10px 15px; font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .size-option.selected { border-color: #000; background: #000; color: #fff; }
        .size-option.disabled { opacity: 0.3; pointer-events: none; text-decoration: line-through; border-color: #eee; }

        .sticky-btn-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 15px 20px 25px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            z-index: 90;
        }
        .big-btn {
            width: 100%; background: #000; color: #fff; border: none;
            padding: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer;
        }
        .big-btn:disabled { background: #ccc; }

        /* --- CART VIEW --- */
        #view-cart { padding: 20px; min-height: 100vh; }
        .cart-title { font-family: var(--font-serif); font-size: 32px; margin-bottom: 30px; text-align: center; }
        .cart-list { display: flex; flex-direction: column; gap: 20px; }
        .cart-item {
            display: flex; gap: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px;
        }
        .cart-img { width: 80px; height: 106px; object-fit: cover; background: #f4f4f4; }
        .cart-details { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-name { font-family: var(--font-serif); font-size: 18px; }
        .cart-meta { font-size: 12px; color: #666; text-transform: uppercase; margin-top: 5px; }
        
        .cart-controls { display: flex; justify-content: space-between; align-items: flex-end; }
        .qty-control { display: flex; align-items: center; gap: 15px; border: 1px solid #ddd; padding: 5px 10px; }
        .qty-btn { background: none; border: none; font-size: 16px; padding: 0 5px; cursor: pointer; }
        
        .empty-cart { text-align: center; padding: 50px 0; color: #999; font-style: italic; }

        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="loader-logo">SLIYANIE</div>
        <div class="spinner"></div>
    </div>

    <div id="view-main" class="view-section active">
        <div class="magazine-cover">
            <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=800&auto=format&fit=crop" class="cover-bg" alt="Cover">
            <div class="cover-overlay"></div>
            
            <div class="brand-logo-large">
                <img src="logo.png" alt="SLIYANIE" onerror="this.style.display='none'; document.querySelector('.loader-logo').style.display='block'">
            </div>
            <div class="issue-date">New Collection</div>
        </div>

        <div class="nav-header">
            <div class="nav-tabs">
                <div class="nav-item active" onclick="filterProducts('all', this)">Все</div>
                <div class="nav-item" onclick="filterProducts('Платья', this)">Платья</div>
                <div class="nav-item" onclick="filterProducts('Костюмы', this)">Костюмы</div>
                <div class="nav-item" onclick="filterProducts('Верхняя одежда', this)">Верхняя</div>
            </div>
            
            <div class="cart-icon-wrap" onclick="openCart()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <div class="cart-count" id="cart-badge">0</div>
            </div>
        </div>

        <div class="editorial-grid" id="product-grid">
            </div>

        <div style="text-align: center; padding: 40px 20px; background: #f9f9f9; margin-top: 30px;">
            <p style="font-family: 'Cormorant Garamond', serif; font-style: italic; margin-bottom: 10px;">
                "Стиль — это способ сказать, кто ты, не произнося ни слова."
            </p>
            <a href="https://t.me/SLIYANIE_showroom" style="text-decoration:none; color:#000; font-size:10px; text-transform:uppercase; border-bottom:1px solid #000;">Связаться с менеджером</a>
        </div>
    </div>

    <div id="view-product" class="view-section">
        <div id="product-detail-container"></div>
    </div>

    <div id="view-cart" class="view-section">
        <div class="cart-title">Корзина</div>
        <div class="cart-list" id="cart-list-container">
            </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // ССЫЛКА НА ТВОЙ СКРИПТ
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFHqJpvqsVICG7V6mYWxvAdWGOJnZtizMrGSbhIaTNoWaL_AoArdmR4ELfT4BM-Uk5/exec'; 

        let allProducts = [];
        let cart = [];
        let currentView = 'main'; // main, product, cart

        // --- ИНИЦИАЛИЗАЦИЯ ---
        async function fetchProducts() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                if (!response.ok) throw new Error("Ошибка доступа");
                const rawData = await response.json();
                
                allProducts = rawData.map(processProductData);
                
                // Скрываем прелоадер
                const preloader = document.getElementById('preloader');
                preloader.style.opacity = '0';
                setTimeout(() => preloader.style.display = 'none', 500);

                renderGrid('all');
            } catch (error) {
                console.error(error);
                document.getElementById('preloader').innerHTML = `<div style="color:#990000; padding:20px; text-align:center;">Ошибка загрузки. Попробуйте позже.</div>`;
            }
        }

        function processProductData(p) {
            // Обработка размеров и количества
            let totalQty = 0;
            let parsedSizes = [];
            let sizesStr = Array.isArray(p.sizes) ? p.sizes.join(',') : p.sizes;
            
            if (sizesStr) {
                const parts = sizesStr.split(',');
                parts.forEach(part => {
                    let [sizeName, qtyStr] = part.split(':');
                    sizeName = sizeName ? sizeName.trim() : "ONE";
                    let qty = qtyStr ? parseInt(qtyStr.trim()) : 999;
                    totalQty += qty;
                    parsedSizes.push({ name: sizeName, qty: qty });
                });
            } else {
                parsedSizes.push({ name: "ONE", qty: 999 });
                totalQty = 999;
            }

            // Обработка дополнительных фото (ожидаем массив или строку с запятыми из таблицы)
            // Если в таблице нет поля additional_images, используем только главное
            let images = [p.image];
            if (p.additional_images) {
                 if (Array.isArray(p.additional_images)) {
                    images = [...images, ...p.additional_images];
                 } else {
                    images = [...images, ...p.additional_images.split(',').map(s => s.trim())];
                 }
            }

            return {
                ...p,
                parsedSizes,
                totalQuantity: totalQty,
                images: images,
                // Если нет описания в таблице, ставим заглушку
                description: p.description || "Изысканная модель из новой коллекции SLIYANIE. Идеальная посадка и премиальные материалы.",
                composition: p.composition || "100% Премиальный текстиль"
            };
        }

        // --- НАВИГАЦИЯ ---
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            window.scrollTo(0, 0);

            if (viewName === 'main') {
                document.getElementById('view-main').classList.add('active');
                tg.BackButton.hide();
                tg.MainButton.hide();
                currentView = 'main';
            } 
            else if (viewName === 'product') {
                document.getElementById('view-product').classList.add('active');
                tg.BackButton.show();
                tg.MainButton.hide(); // На карточке товара есть своя кнопка "В корзину"
                currentView = 'product';
            }
            else if (viewName === 'cart') {
                document.getElementById('view-cart').classList.add('active');
                tg.BackButton.show();
                updateMainButton(); // В корзине показываем MainButton для оплаты
                currentView = 'cart';
            }
        }

        tg.BackButton.onClick(function() {
            if (currentView === 'product') {
                switchView('main');
            } else if (currentView === 'cart') {
                switchView('main');
            }
        });

        // --- ВИТРИНА (GRID) ---
        function renderGrid(filter) {
            const container = document.getElementById('product-grid');
            container.innerHTML = '';
            const filtered = filter === 'all' ? allProducts : allProducts.filter(p => p.category === filter);

            if (filtered.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#999;">В этой категории пока пусто.</div>';
                return;
            }

            filtered.forEach(product => {
                let badgeHtml = '';
                if (product.totalQuantity <= 0) badgeHtml = `<div class="badge sold-out">Sold Out</div>`;
                else if (product.totalQuantity < 3) badgeHtml = `<div class="badge alert">Last One</div>`;
                else if (product.badge) badgeHtml = `<div class="badge">${product.badge}</div>`;

                const el = document.createElement('div');
                el.className = 'product-article';
                el.onclick = () => openProduct(product.id); // Проваливаемся в товар
                
                el.innerHTML = `
                    <div class="photo-frame">
                        ${badgeHtml}
                        <img src="${product.image}" class="product-img" loading="lazy" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">${parseInt(product.price).toLocaleString()} ₽</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function filterProducts(cat, btn) {
            tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid(cat);
        }

        // --- КАРТОЧКА ТОВАРА ---
        let currentSelectedSize = null;

        function openProduct(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            currentSelectedSize = null; // Сброс выбора
            const container = document.getElementById('product-detail-container');
            
            // Генерация слайдов
            let slidesHtml = product.images.map(img => `<div class="detail-slide"><img src="${img}"></div>`).join('');
            let dotsHtml = product.images.length > 1 ? product.images.map((_, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('') : '';

            // Генерация размеров
            let sizesHtml = product.parsedSizes.map(s => {
                const disabled = s.qty <= 0 ? 'disabled' : '';
                return `<div class="size-option ${disabled}" onclick="selectSize('${s.name}', ${product.id}, this)">${s.name}</div>`;
            }).join('');

            // Кнопка
            let btnText = product.totalQuantity > 0 ? 'ДОБАВИТЬ В КОРЗИНУ' : 'ПРОДАНО';
            let btnDisabled = product.totalQuantity <= 0;

            container.innerHTML = `
                <div class="detail-slider" onscroll="updateDots(this)">${slidesHtml}</div>
                <div class="slider-dots">${dotsHtml}</div>
                
                <div class="detail-content">
                    <div class="detail-header">
                        <div class="detail-title">${product.name}</div>
                        <div class="detail-price">${parseInt(product.price).toLocaleString()} ₽</div>
                    </div>
                    
                    <div class="detail-desc">${product.description}</div>
                    <div class="detail-meta">Состав: ${product.composition}</div>

                    <div class="size-selector-wrap">
                        <span class="size-label">Выберите размер:</span>
                        <div class="sizes-grid">${sizesHtml}</div>
                    </div>
                </div>

                <div class="sticky-btn-container">
                    <button class="big-btn" id="add-btn" onclick="addToCart(${product.id})" ${btnDisabled ? 'disabled' : ''}>
                        ${btnText}
                    </button>
                </div>
            `;
            
            switchView('product');
        }

        function updateDots(slider) {
            const index = Math.round(slider.scrollLeft / slider.offsetWidth);
            const dots = document.querySelectorAll('.dot');
            dots.forEach((d, i) => {
                if(i === index) d.classList.add('active');
                else d.classList.remove('active');
            });
        }

        function selectSize(sizeName, pid, el) {
            if (el.classList.contains('disabled')) return;
            
            document.querySelectorAll('.size-option').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            currentSelectedSize = sizeName;
            tg.HapticFeedback.selectionChanged();
        }

        // --- КОРЗИНА ФУНКЦИОНАЛ ---
        function addToCart(id) {
            if (!currentSelectedSize) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showPopup({ title: 'Размер?', message: 'Пожалуйста, выберите размер перед добавлением.' });
                return;
            }

            const product = allProducts.find(p => p.id === id);
            const sizeObj = product.parsedSizes.find(s => s.name === currentSelectedSize);
            const inCartItem = cart.find(i => i.id === id && i.size === currentSelectedSize);
            const currentQty = inCartItem ? inCartItem.quantity : 0;

            if (currentQty + 1 > sizeObj.qty) {
                tg.showPopup({ message: `Доступно только ${sizeObj.qty} шт.` });
                return;
            }

            if (inCartItem) {
                inCartItem.quantity++;
            } else {
                cart.push({ ...product, size: currentSelectedSize, quantity: 1 });
            }

            tg.HapticFeedback.notificationOccurred('success');
            
            // Анимация кнопки
            const btn = document.getElementById('add-btn');
            const originalText = btn.innerText;
            btn.innerText = "ДОБАВЛЕНО";
            btn.style.background = "#333";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "#000";
            }, 1000);
            
            updateCartBadge();
        }

        function openCart() {
            renderCart();
            switchView('cart');
        }

        function renderCart() {
            const container = document.getElementById('cart-list-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart">Ваша корзина пуста</div>';
                return;
            }

            cart.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `
                    <img src="${item.image}" class="cart-img">
                    <div class="cart-details">
                        <div>
                            <div class="cart-name">${item.name}</div>
                            <div class="cart-meta">Размер: ${item.size} | ${parseInt(item.price).toLocaleString()} ₽</div>
                        </div>
                        <div class="cart-controls">
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function changeQty(index, delta) {
            const item = cart[index];
            const product = allProducts.find(p => p.id === item.id);
            const sizeObj = product.parsedSizes.find(s => s.name === item.size);

            const newQty = item.quantity + delta;

            if (newQty <= 0) {
                // Удаление
                cart.splice(index, 1);
            } else {
                if (newQty > sizeObj.qty) {
                    tg.showPopup({ message: 'Больше нет в наличии' });
                    return;
                }
                item.quantity = newQty;
            }
            
            tg.HapticFeedback.selectionChanged();
            renderCart();
            updateCartBadge();
            updateMainButton();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const total = cart.reduce((acc, i) => acc + i.quantity, 0);
            badge.innerText = total;
            if (total > 0) badge.classList.add('visible');
            else badge.classList.remove('visible');
        }

        function updateMainButton() {
            if (currentView === 'cart' && cart.length > 0) {
                const total = cart.reduce((acc, i) => acc + (i.price * i.quantity), 0);
                tg.MainButton.setText(`ОФОРМИТЬ • ${total.toLocaleString()} ₽`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // --- ОТПРАВКА ЗАКАЗА ---
        tg.MainButton.setParams({ color: '#000000', text_color: '#ffffff' });
        tg.MainButton.onClick(function() {
            const orderData = cart.map(i => ({
                id: i.id,
                name: i.name,
                price: i.price,
                size: i.size,
                qty: i.quantity
            }));
            tg.sendData(JSON.stringify(orderData));
        });

        // Старт
        fetchProducts();

    </script>
</body>
</html>
