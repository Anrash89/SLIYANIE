<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLIYANIE | Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #ffffff;
            --text: #111;
            --gray: #f5f5f5;
            --accent: #000;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Raleway', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
        }

        /* --- АДАПТИВНАЯ СЕТКА (ПК vs ТЕЛЕФОН) --- */
        .container {
            max-width: 1200px; /* Шире для ПК */
            margin: 0 auto;
            padding: 0 15px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 колонки на телефоне */
            gap: 15px;
            padding: 20px 0;
        }

        /* На ПК делаем 4 колонки */
        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 30px;
            }
            .cover-block { height: 60vh !important; }
        }

        /* --- СИСТЕМА ЭКРАНОВ (SPA) --- */
        .page {
            display: none;
            opacity: 0;
            animation: fadeIn 0.4s forwards;
        }
        .page.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ШАПКА --- */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .header-inner {
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: var(--font-serif); font-size: 24px; font-weight: 600; letter-spacing: 1px; }
        
        .cart-btn { position: relative; cursor: pointer; padding: 5px; }
        .cart-count {
            position: absolute; top: 0; right: -5px;
            background: #000; color: #fff;
            font-size: 10px; width: 16px; height: 16px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: 0.3s;
        }
        .cart-count.show { opacity: 1; }

        /* --- ОБЛОЖКА --- */
        .cover-block {
            position: relative; width: 100%; height: 45vh;
            background: #ddd; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .cover-img { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); opacity: 0.9; }
        .cover-text { position: relative; color: #fff; z-index: 2; text-align: center; }
        .cover-title { font-family: var(--font-serif); font-size: 42px; text-transform: uppercase; margin-bottom: 10px; }

        /* --- ТАБЫ КАТЕГОРИЙ --- */
        .tabs {
            display: flex; gap: 20px; overflow-x: auto; padding: 15px 0;
            border-bottom: 1px solid #f0f0f0; margin-bottom: 20px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            font-family: var(--font-serif); font-size: 18px; color: #888; white-space: nowrap; cursor: pointer;
            transition: 0.3s;
        }
        .tab.active { color: #000; font-style: italic; border-bottom: 1px solid #000; }

        /* --- КАРТОЧКА ТОВАРА (В СПИСКЕ) --- */
        .card { cursor: pointer; }
        .card-img-wrap {
            position: relative; aspect-ratio: 3/4; background: #f0f0f0; overflow: hidden; margin-bottom: 10px;
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-img { transform: scale(1.05); }
        .card-title { font-family: var(--font-serif); font-size: 16px; margin-bottom: 4px; line-height: 1.1; }
        .card-price { font-size: 14px; color: #555; }

        /* --- ДЕТАЛЬНАЯ СТРАНИЦА --- */
        .detail-layout {
            display: grid; grid-template-columns: 1fr; gap: 20px;
        }
        @media (min-width: 768px) {
            .detail-layout { grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
            .gallery { height: auto !important; aspect-ratio: 3/4; }
        }

        .gallery {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            height: 55vh; background: #eee;
        }
        .gallery-item { flex: 0 0 100%; scroll-snap-align: start; }
        .gallery-img { width: 100%; height: 100%; object-fit: cover; }

        .info-block { padding: 0 15px; }
        .product-h1 { font-family: var(--font-serif); font-size: 28px; margin-bottom: 10px; line-height: 1; }
        .product-price-lg { font-family: var(--font-serif); font-size: 22px; font-style: italic; margin-bottom: 20px; }
        .desc-text { font-size: 14px; line-height: 1.6; color: #444; margin-bottom: 20px; }
        
        .sizes-row { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .size-btn {
            border: 1px solid #ddd; padding: 12px 20px; cursor: pointer; transition: 0.2s; min-width: 50px; text-align: center;
        }
        .size-btn.selected { background: #000; color: #fff; border-color: #000; }
        .size-btn.disabled { opacity: 0.3; pointer-events: none; text-decoration: line-through; }

        /* --- КНОПКА КУПИТЬ --- */
        .sticky-action {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #fff; padding: 15px 20px 30px; border-top: 1px solid #eee; z-index: 90;
        }
        .main-btn {
            width: 100%; background: #000; color: #fff; border: none; padding: 16px;
            text-transform: uppercase; letter-spacing: 2px; font-size: 12px; cursor: pointer;
        }
        .main-btn:disabled { background: #ccc; }

        /* --- КОРЗИНА --- */
        .cart-item { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid #eee; }
        .cart-thumb { width: 70px; height: 90px; object-fit: cover; background: #eee; }
        .cart-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .cart-qty { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .qty-control { width: 30px; height: 30px; border: 1px solid #ddd; background: none; cursor: pointer; }

        /* --- НАЗАД (СВОЯ КНОПКА ДЛЯ ПК) --- */
        .back-nav {
            display: none; align-items: center; gap: 5px; cursor: pointer; font-size: 14px; color: #666; margin-bottom: 20px;
        }
        @media (min-width: 768px) { .back-nav { display: flex; } }

        /* --- ЗАГЛУШКИ --- */
        .loader { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; justify-content: center; align-items: center; }
        .empty-msg { text-align: center; padding: 50px; color: #999; }
    </style>
</head>
<body>

    <div class="loader" id="loader">SLIYANIE Loading...</div>

    <div id="page-main" class="page active">
        <div class="header">
            <div class="container header-inner">
                <div class="logo">SLIYANIE</div>
                <div class="cart-btn" onclick="goToCart()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <div class="cart-count" id="cart-badge">0</div>
                </div>
            </div>
        </div>

        <div class="cover-block">
            <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1200" class="cover-img">
            <div class="cover-text">
                <div class="cover-title">New Collection</div>
                <p style="letter-spacing: 2px; font-size: 12px;">LUXURY FEMME COUTURE</p>
            </div>
        </div>

        <div class="container">
            <div class="tabs" id="category-tabs">
                <div class="tab active" onclick="filterBy('all', this)">Все</div>
                <div class="tab" onclick="filterBy('Платья', this)">Платья</div>
                <div class="tab" onclick="filterBy('Костюмы', this)">Костюмы</div>
                <div class="tab" onclick="filterBy('Верхняя одежда', this)">Верхняя</div>
            </div>

            <div class="product-grid" id="grid">
                </div>
        </div>
    </div>

    <div id="page-product" class="page">
        <div class="header">
            <div class="container header-inner">
                <div onclick="goBack()" style="cursor: pointer; font-size: 14px;">← НАЗАД</div>
                <div class="logo" style="font-size: 18px;">SLIYANIE</div>
                <div class="cart-btn" onclick="goToCart()">
                    <svg width="20" height="20" stroke="currentColor" fill="none" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line></svg>
                </div>
            </div>
        </div>
        <div class="container" style="padding-top: 20px;">
            <div id="product-content"></div>
        </div>
    </div>

    <div id="page-cart" class="page">
        <div class="header">
            <div class="container header-inner">
                <div onclick="goBack()" style="cursor: pointer;">← КАТАЛОГ</div>
                <div class="logo">КОРЗИНА</div>
                <div style="width: 24px;"></div>
            </div>
        </div>
        <div class="container" id="cart-content" style="padding-top: 20px;"></div>
        
        <div class="sticky-action" id="cart-actions" style="display:none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:600;">
                <span>ИТОГО:</span>
                <span id="cart-total">0 ₽</span>
            </div>
            <button class="main-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        // ЗАМЕНИ НА СВОЙ URL, ЕСЛИ ОН ИЗМЕНИЛСЯ
        const API_URL = 'https://script.google.com/macros/s/AKfycbyFHqJpvqsVICG7V6mYWxvAdWGOJnZtizMrGSbhIaTNoWaL_AoArdmR4ELfT4BM-Uk5/exec';
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // --- СОСТОЯНИЕ ---
        let catalog = [];
        let cart = JSON.parse(localStorage.getItem('sliyanie_cart')) || []; // Загружаем сохраненную корзину
        let currentCategory = 'all';

        // --- ЗАПУСК ---
        init();

        async function init() {
            try {
                // Обработка кнопки "Назад" в Telegram
                tg.BackButton.onClick(goBack);
                
                // Обработка браузерной истории (для ПК и Android свайпов)
                window.addEventListener('popstate', (event) => {
                    if (event.state && event.state.page) {
                        showPage(event.state.page, false);
                    } else {
                        showPage('page-main', false);
                    }
                });

                // Первичная запись истории
                history.replaceState({page: 'page-main'}, '', '');

                updateCartCounter();
                
                const res = await fetch(API_URL);
                if(!res.ok) throw new Error("Network error");
                
                const rawData = await res.json();
                
                // Парсим данные
                catalog = rawData.map(p => {
                    // Размеры
                    let sizes = [];
                    if(p.sizes) {
                        // Пробуем понять формат (строка или массив)
                        let str = Array.isArray(p.sizes) ? p.sizes.join(',') : p.sizes;
                        str.split(',').forEach(s => {
                            let [name, qty] = s.split(':');
                            sizes.push({ name: name.trim(), qty: qty ? +qty : 999 });
                        });
                    } else {
                        sizes.push({name: 'ONE', qty: 999});
                    }

                    // Картинки
                    let images = [p.image];
                    if(p.additional_images) {
                         // Удаляем пробелы и разбиваем
                         let add = p.additional_images.toString().split(',').map(src => src.trim());
                         images = [...images, ...add];
                    }

                    return { ...p, sizes, images, totalQty: sizes.reduce((a,b)=>a+b.qty, 0) };
                });

                renderGrid('all');
                document.getElementById('loader').style.display = 'none';

            } catch(e) {
                document.getElementById('loader').innerHTML = 'Ошибка загрузки: ' + e.message;
            }
        }

        // --- НАВИГАЦИЯ (ROUTER) ---
        function navigateTo(pageId, params = null) {
            // Добавляем запись в историю браузера
            history.pushState({page: pageId, params}, '', '');
            showPage(pageId, true, params);
        }

        function goBack() {
            // Если есть история браузера, идем назад
            if (history.state && history.state.page !== 'page-main') {
                history.back();
            } else {
                // Если мы уже на главной, ничего не делаем (или можно закрыть апп)
                // tg.close();
            }
        }

        function showPage(pageId, pushToHistory = false, params = null) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);

            if (pageId === 'page-main') {
                tg.BackButton.hide();
                tg.MainButton.hide();
            } else {
                tg.BackButton.show();
                tg.MainButton.hide(); // Скрываем стандартную, используем свои кнопки
            }
        }

        // --- ГЛАВНАЯ СТРАНИЦА ---
        function renderGrid(cat) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            const filtered = cat === 'all' ? catalog : catalog.filter(p => p.category.toLowerCase().includes(cat.toLowerCase()));
            
            if(filtered.length === 0) {
                grid.innerHTML = '<div class="empty-msg">В этой категории пока пусто</div>';
                return;
            }

            filtered.forEach(p => {
                const el = document.createElement('div');
                el.className = 'card';
                el.onclick = () => openProduct(p.id);
                el.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${p.image}" class="card-img" loading="lazy">
                    </div>
                    <div class="card-title">${p.name}</div>
                    <div class="card-price">${parseInt(p.price).toLocaleString()} ₽</div>
                `;
                grid.appendChild(el);
            });
        }

        function filterBy(cat, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderGrid(cat);
        }

        // --- СТРАНИЦА ТОВАРА ---
        let selectedSize = null;
        let currentProduct = null;

        function openProduct(id) {
            currentProduct = catalog.find(p => p.id === id);
            if(!currentProduct) return;
            
            selectedSize = null;
            navigateTo('page-product');

            const container = document.getElementById('product-content');
            
            // Слайдер картинок
            const imagesHtml = currentProduct.images.map(src => 
                `<div class="gallery-item"><img src="${src}" class="gallery-img"></div>`
            ).join('');

            // Кнопки размеров
            const sizesHtml = currentProduct.sizes.map(s => {
                const disabled = s.qty <= 0 ? 'disabled' : '';
                return `<div class="size-btn ${disabled}" onclick="selectSize('${s.name}', this)">${s.name}</div>`;
            }).join('');

            const btnText = currentProduct.totalQty > 0 ? 'В КОРЗИНУ' : 'ПРОДАНО';
            const btnDisabled = currentProduct.totalQty <= 0;

            container.innerHTML = `
                <div class="detail-layout">
                    <div class="gallery">${imagesHtml}</div>
                    
                    <div class="info-block">
                        <h1 class="product-h1">${currentProduct.name}</h1>
                        <div class="product-price-lg">${parseInt(currentProduct.price).toLocaleString()} ₽</div>
                        
                        <div class="desc-text">${currentProduct.description || 'Описание отсутствует.'}</div>
                        <div style="font-size:12px; color:#888; margin-bottom:20px;">Состав: ${currentProduct.composition || '-'}</div>

                        <div style="font-weight:600; font-size:12px; margin-bottom:10px;">ВЫБЕРИТЕ РАЗМЕР:</div>
                        <div class="sizes-row">${sizesHtml}</div>
                    </div>
                </div>
                
                <div class="sticky-action">
                    <button class="main-btn" id="addBtn" onclick="addToCartLogic()" ${btnDisabled ? 'disabled' : ''}>${btnText}</button>
                </div>
            `;
        }

        function selectSize(name, el) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedSize = name;
            
            // Если выбрали размер - снимаем ошибку (тряску кнопки) если была
            const btn = document.getElementById('addBtn');
            btn.innerText = `В КОРЗИНУ (${name})`;
        }

        function addToCartLogic() {
            if(!selectedSize) {
                tg.HapticFeedback.notificationOccurred('error');
                const btn = document.getElementById('addBtn');
                btn.innerText = "ВЫБЕРИТЕ РАЗМЕР!";
                btn.style.background = "#9e0b0b";
                setTimeout(() => { btn.innerText = "В КОРЗИНУ"; btn.style.background = "#000"; }, 1000);
                return;
            }

            // Проверка наличия
            const sizeObj = currentProduct.sizes.find(s => s.name === selectedSize);
            const inCart = cart.find(i => i.id === currentProduct.id && i.size === selectedSize);
            const qtyInCart = inCart ? inCart.qty : 0;

            if(qtyInCart >= sizeObj.qty) {
                tg.showPopup({message: 'Больше нет в наличии'});
                return;
            }

            // Добавляем
            if(inCart) {
                inCart.qty++;
            } else {
                cart.push({
                    id: currentProduct.id,
                    name: currentProduct.name,
                    price: currentProduct.price,
                    image: currentProduct.image,
                    size: selectedSize,
                    qty: 1,
                    maxQty: sizeObj.qty
                });
            }

            saveCart();
            updateCartCounter();
            tg.HapticFeedback.notificationOccurred('success');

            const btn = document.getElementById('addBtn');
            btn.innerText = "ДОБАВЛЕНО";
            btn.style.background = "#333";
            setTimeout(() => { 
                btn.innerText = `В КОРЗИНУ (${selectedSize})`; 
                btn.style.background = "#000"; 
            }, 1000);
        }

        // --- КОРЗИНА ---
        function goToCart() {
            navigateTo('page-cart');
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-content');
            const actions = document.getElementById('cart-actions');
            
            if(cart.length === 0) {
                container.innerHTML = '<div class="empty-msg">Ваша корзина пуста.<br>Самое время что-то выбрать.</div>';
                actions.style.display = 'none';
                return;
            }

            actions.style.display = 'block';
            let html = '';
            let total = 0;

            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" class="cart-thumb">
                        <div class="cart-info">
                            <div style="font-family: var(--font-serif); font-size:16px;">${item.name}</div>
                            <div style="font-size:12px; color:#666;">Размер: ${item.size}</div>
                            <div style="font-size:14px; margin-top:5px;">${parseInt(item.price).toLocaleString()} ₽</div>
                            
                            <div class="cart-qty">
                                <button class="qty-control" onclick="modQty(${idx}, -1)">−</button>
                                <span>${item.qty}</span>
                                <button class="qty-control" onclick="modQty(${idx}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cart-total').innerText = total.toLocaleString() + ' ₽';
            
            // На всякий случай обновляем MainButton (хотя используем свою HTML кнопку)
            // tg.MainButton.setText(`ОПЛАТИТЬ ${total} ₽`);
            // tg.MainButton.show();
        }

        function modQty(idx, delta) {
            const item = cart[idx];
            const newQty = item.qty + delta;

            if(newQty <= 0) {
                cart.splice(idx, 1);
            } else {
                if(newQty > item.maxQty) {
                    tg.showPopup({message: 'Больше нет в наличии'});
                    return;
                }
                item.qty = newQty;
            }
            saveCart();
            renderCart();
            updateCartCounter();
        }

        function saveCart() {
            localStorage.setItem('sliyanie_cart', JSON.stringify(cart));
        }

        function updateCartCounter() {
            const el = document.getElementById('cart-badge');
            const total = cart.reduce((a,b) => a + b.qty, 0);
            el.innerText = total;
            el.classList.toggle('show', total > 0);
        }

        function checkout() {
            if(cart.length === 0) return;
            tg.sendData(JSON.stringify(cart));
        }

    </script>
</body>
</html>
